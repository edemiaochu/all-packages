<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7297f4"/>
      <stop offset="100%" stop-color="#35c7e7"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形外框，描边更细 -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="#ffffff" stroke="url(#frameGradient)" stroke-width="14"/>

  <g transform="translate(256, 256)">
    <!-- 中心圆形轮廓 -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#0f4088" stroke-width="22"/>

    <!-- 五条细横线 -->
    <line x1="-110" y1="-80" x2="110" y2="-80" stroke="#0f4088" stroke-width="18"/>
    <line x1="-120" y1="-35" x2="120" y2="-35" stroke="#0f4088" stroke-width="18"/>
    <line x1="-130" y1="10" x2="130" y2="10" stroke="#0f4088" stroke-width="18"/>
    <line x1="-120" y1="55" x2="120" y2="55" stroke="#0f4088" stroke-width="18"/>
    <line x1="-110" y1="100" x2="110" y2="100" stroke="#0f4088" stroke-width="18"/>
  </g>
</svg>
