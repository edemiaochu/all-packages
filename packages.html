  .toolbar .count { color: #8b949e; font-size: 16px; margin-left: auto; }

  .group {

  .group-header:hover { background: #1c2128; }
  .group-header .arrow { color: #8b949e; transition: .2s; }
  .group.collapsed .group-header .arrow { transform: rotate(-90deg); }
  .group-header .name { font-weight: 600; font-size: 20px; color: #e6edf3; }
  .group-header .badge {
    font-size: 14px; padding: 3px 10px; border-radius: 12px;
    background: #1f6feb33; color: #58a6ff; margin-left: 6px;
  }
  .group-header .desc { color: #8b949e; font-size: 15px; }
  .table-wrap { overflow-x: auto; }
  .group.collapsed .table-wrap { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; line-height: 1.7; }
  th {
    text-align: left; padding: 14px 24px; color: #8b949e; font-weight: 500;
    font-size: 14px; text-transform: uppercase; background: #0d1117;
  }
  td { padding: 12px 24px; border-top: 1px solid #21262d; }
  tr:hover td { background: #161b2233; }
  .pkg-name { font-family: monospace; color: #e6edf3; font-size: 16px; }
  .pkg-name.no-publish { color: #8b949e; font-style: italic; }
  .pkg-folder { font-family: monospace; color: #8b949e; font-size: 14px; }
  .tag {
    display: inline-block; font-size: 14px; padding: 3px 10px; border-radius: 10px;
    font-weight: 500; margin-right: 4px;
  }
  .tag.publish { background: #23863622; color: #3fb950; }
  .tag.private { background: #da363322; color: #f85149; }
  .tag.category { background: #a371f722; color: #a371f7; }
  .tag.version { background: #d2992222; color: #d29922; }
  .tag.tool-rush { background: #1f6feb22; color: #58a6ff; }
  .tag.tool-pnpm { background: #d2992222; color: #d29922; }
  .tag.tool-yarn { background: #3fb95022; color: #3fb950; }
  .footer {
    text-align: center; padding: 32px; color: #484f58; font-size: 15px;
    border-top: 1px solid #21262d;
  }
  @media (max-width: 768px) {
    .header, .toolbar, .groups { padding-left: 16px; padding-right: 16px; }
    .toolbar input { width: 100%; }
    .toolbar { flex-direction: column; align-items: stretch; }
  }

const groups = {
  'iprojectjs-core': { name: 'iprojectjs-core', desc: 'iProject.js 核心框架', tool: 'Rush' },
  'viewer': { name: 'viewer', desc: 'iProject 查看器组件', tool: 'Rush' },
  'iworks-clients': { name: 'iworks-clients', desc: 'iWork 客户端 SDK', tool: 'Rush' },
  'object-storage': { name: 'object-storage', desc: '对象存储抽象层', tool: 'Rush' },
  'admin-components-react': { name: 'admin-components-react', desc: '管理组件', tool: 'Rush' },
  'appui': { name: 'appui', desc: 'AppUI 应用框架', tool: 'pnpm' },
  'presentation': { name: 'presentation', desc: '演示组件与选择系统', tool: 'pnpm' },
  'iProjectUI': { name: 'iProjectUI', desc: 'iProject UI 组件库', tool: 'pnpm' },
  'viewer-components-react': { name: 'viewer-components-react', desc: '查看器 React 组件', tool: 'pnpm' },
  'auth-clients': { name: 'auth-clients', desc: '认证客户端 SDK', tool: 'pnpm' },
  'iProjectUI-layouts': { name: 'iProjectUI-layouts', desc: 'iProject UI 布局组件', tool: 'Yarn' },
  'reality-capture': { name: 'reality-capture', desc: '实景捕捉 SDK', tool: 'pnpm' },
};

function toolClass(t) { if (t === 'Rush') return 'tool-rush'; if (t === 'pnpm') return 'tool-pnpm'; return 'tool-yarn'; }

var collapsedGroups = new Set();
function toggleGroup(el, key) {
  el.parentElement.classList.toggle('collapsed');
  if (el.parentElement.classList.contains('collapsed')) {
    collapsedGroups.add(key);
  } else {
    collapsedGroups.delete(key);
  }
}

function render() {
  var search = document.getElementById('search').value.toLowerCase();
  var filter = document.getElementById('filter').value;
  var total = 0, shown = 0;
  var container = document.getElementById('groups');
  container.innerHTML = '';

  var keys = Object.keys(groups);
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var info = groups[key];
    var filtered = DATA.filter(function(p) {
      if (p.subproject !== key) return false;
      if (filter === 'publish' && !p.publish) return false;
      if (filter === 'private' && p.publish) return false;
      if (search && p.name.toLowerCase().indexOf(search) === -1 && p.folder.toLowerCase().indexOf(search) === -1) return false;
      return true;
    });
    var allPkgs = DATA.filter(function(p) { return p.subproject === key; });
    total += allPkgs.length;
    shown += filtered.length;
    if (filtered.length === 0 && search) continue;

    var rows = '';
    for (var j = 0; j < filtered.length; j++) {
      var p = filtered[j];
      rows += '<tr>' +
        '<td><span class="pkg-name' + (p.publish ? '' : ' no-publish') + '">' + esc(p.name) + '</span></td>' +
        '<td><span class="pkg-folder">' + esc(p.folder) + '</span></td>' +
        '<td><span class="tag ' + (p.publish ? 'publish' : 'private') + '">' + (p.publish ? '发布' : '私有') + '</span></td>' +
        '<td>' + (p.category ? '<span class="tag category">' + esc(p.category) + '</span>' : '—') + '</td>' +
        '<td>' + (p.versionPolicy ? '<span class="tag version">' + esc(p.versionPolicy) + '</span>' : '—') + '</td>' +
      '</tr>';
    }

    var collapsed = collapsedGroups.has(key) ? " collapsed" : "";
    var html = '<div class="group' + collapsed + '">' +
      '<div class="group-header" onclick="toggleGroup(this,' + "'" + key + "'" + ')">' +

        '<span class="arrow">&#9660;</span>' +
        '<span class="name">' + esc(info.name) + '</span>' +
        '<span class="badge">' + allPkgs.length + ' 包</span>' +
        '<span class="tag ' + toolClass(info.tool) + '">' + info.tool + '</span>' +
        '<span class="desc">— ' + esc(info.desc) + '</span>' +
      '</div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>包名</th><th>路径</th><th>状态</th><th>分类</th><th>版本策略</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +
    '</div>';
    container.insertAdjacentHTML('beforeend', html);
  }
  document.getElementById('totalCount').textContent = total;
  document.getElementById('filteredCount').textContent = '显示 ' + shown + ' / ' + total + ' 个包';
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.getElementById('search').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);
render();
</script>
